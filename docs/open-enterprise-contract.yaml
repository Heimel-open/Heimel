schema_version: 2
product: Heimel
status: canonical

principle:
  open: "Everything required to understand, build, integrate, test and locally operate governed execution is open."
  commercial: "Everything required to govern governed execution authoritatively across an organization is commercial infrastructure."

open_heimel:
  guarantees:
    - complete_local_execution
    - no_phone_home
    - no_license_server
    - no_required_cloud_account
    - no_artificial_feature_disablement
    - local_allow_deny_escalate
    - revocation_and_fresh_authority_checks
    - deterministic_replay
    - local_receipts_and_evidence
  includes:
    - kernel
    - reht
    - racs
    - gateway_reference_and_runtime_surface
    - veritas_reference_and_runtime_surface
    - vaig
    - mal
    - workflow_isa
    - function_fabric
    - standard_functions
    - domain_packs
    - schemas
    - authority_contracts
    - provenance_envelope
    - conformance_suite
    - demonstrators
    - sdks
    - adapters
    - documentation
  invariant: "A user must be able to execute and prove the governed consequence path locally without contacting Heimel or obtaining a commercial entitlement."

enterprise:
  purpose: "Provide authoritative organization-level governance of governed execution."
  capabilities:
    - identity_federation
    - sso
    - scim
    - iam_integration
    - authority_administration
    - separation_of_duties
    - approval_flows
    - policy_lifecycle
    - policy_versioning
    - rollback
    - organization_boundaries
    - delegated_administration
    - multi_tenant_isolation
    - secrets_management
    - deployment_governance
    - high_availability
    - disaster_recovery
    - retention
    - immutable_evidence_operations
    - observability
    - enterprise_support
    - sla
  rule: "Enterprise must remain separable from the open governed-execution mechanism; it must not be a license lock around the same local capability."

product_layers:
  heimel_open: "Defines and implements governed execution."
  heimel_enterprise: "Administers governed execution across an organization."
  heimel_gateway: "Enforces the exclusive consequence path."
  veritas: "Preserves attributable effect and outcome evidence."
  heimel_certified: "Provides official conformance and compatibility attestation."
  managed:
    - Heimel Cloud
    - Heimel Private Cloud
    - Heimel Sovereign
    - Heimel Air-gapped

certification:
  conformance_suite: open
  official_attestation: commercial
  attestation_must_bind:
    - implementation_identity
    - conformance_suite_version
    - tested_profile
    - test_result
    - issuance_time
    - validity_or_expiry
  rule: "Passing the open suite does not imply an official Heimel certification unless an attestation has been issued."

metering:
  internal_unit: governed_tick
  billing_unit: verified_governed_consequence
  rule: "Governed ticks are internal observability and cost-accounting events. They are not the default customer billing unit."
  governed_tick_uses:
    - cost_accounting
    - observability
    - capacity_planning
    - audit
    - replay
  consequence_definition: "A contract-bound consequence whose governed effect completed and whose required evidence satisfies the consequence contract."
  required_dimensions:
    - tenant_or_organization
    - consequence_id
    - effect_type
    - decision
    - enforcement_result
    - outcome_state
    - evidence_reference
    - timestamp
  no_charge_states:
    - DENY
    - ESCALATE
    - FAILED_EFFECT
    - UNVERIFIED_OUTCOME
    - DUPLICATE
  pricing_rule: "Enterprise pricing is consequence-based. Internal governance work may be metered by tick but customer settlement occurs only for a verified governed consequence."
  forbidden_default:
    - seat_based_primary_pricing
    - governed_tick_billing
    - charge_on_deny
    - charge_on_escalate
    - retrospective_invoice_required

settlement:
  model: prepaid_or_preauthorized_atomic_settlement
  principle: "Settlement follows verified consequence evidence preserved in Veritas and does not require retrospective invoicing."
  sequence:
    - funding_or_allowance_bound
    - proposed_consequence
    - fresh_authority_check
    - permit_issue_and_binding
    - governed_effect
    - veritas_gateway_execution_record
    - outcome_verification
    - veritas_outcome_record
    - veritas_worm_chain_verification
    - consequence_receipt
    - atomic_settlement
  funding_modes:
    - prepaid_balance
    - escrow
    - bounded_payment_allowance
  invariants:
    - "No settlement before a valid bound Veritas Gateway record and Veritas outcome record exist."
    - "Caller-asserted booleans are never sufficient to make a consequence chargeable."
    - "The Veritas WORM chain must verify before settlement eligibility is evaluated."
    - "Gateway execution_id and action_digest must match the settlement contract exactly."
    - "Outcome consequence_id, execution_id, action_digest, completion_criteria_hash and evidence_requirement_hash must match the settlement contract exactly."
    - "DENY, ESCALATE, failed effects and unverified outcomes do not settle."
    - "A consequence_id may settle at most once."
    - "Settlement must bind to the exact consequence contract, price rule and evidence reference."
    - "Terminal receipts must be persisted atomically by idempotency_key."
    - "The payment rail must honor the same idempotency_key as an at-most-once economic capture key."
    - "INSUFFICIENT_FUNDS and transient settlement failures are retryable and must not become terminal receipts."
    - "Crash recovery retries the same pre-bound idempotency_key; it must never mint a new key for the same consequence."
    - "Replay must reproduce settlement eligibility without causing a second charge."
    - "Open Heimel operation remains possible without any commercial settlement mechanism."
  veritas_evidence:
    gateway_event_type: execution_result_observed
    outcome_event_type: consequence_outcome_verified
    authority_granted: false
    rule: "Veritas preserves and attests verifier output; Veritas does not itself grant authority or decide whether completion criteria are satisfied."
  idempotency:
    terminal_receipt_states:
      - SETTLED
      - NOT_CHARGEABLE
    retryable_states:
      - INSUFFICIENT_FUNDS
      - SETTLEMENT_FAILED
    receipt_store_semantics: atomic_put_if_absent
    local_reference_store: sqlite
    distributed_requirement: transactional_unique_key_or_equivalent
    provider_requirement: idempotent_capture_by_same_key
  price_contract:
    currency: USD
    max_decimal_places: 6
    reference_rates:
      micro: "0.001"
      standard_floor: "0.01"
      typical: "0.10"
    rule: "The operative rate is contract-bound before execution. Reference rates are defaults, not immutable protocol constants."
  smart_contract_semantics:
    required_fields:
      - settlement_contract_id
      - consequence_id
      - payer_account
      - currency
      - unit_price
      - funding_reference
      - price_rule_version
      - completion_criteria_hash
      - evidence_requirement_hash
      - idempotency_key
      - veritas_execution_id
      - veritas_gateway_record_id
      - veritas_outcome_record_id
      - expected_action_digest
    terminal_states:
      - SETTLED
      - NOT_CHARGEABLE
    retryable_states:
      - INSUFFICIENT_FUNDS
      - SETTLEMENT_FAILED

licensing:
  repository_default: Apache-2.0
  standard_surfaces: permissive_open_source
  enterprise: separate_software_or_service
  rule: "Do not describe source-available or commercial-use-restricted code as open source."

deployment:
  semantic_equivalence_rule: "Cloud, Private Cloud, Sovereign and Air-gapped are deployment forms of the same governance system, not divergent product semantics."

provider_independence:
  rule: "Heimel does not depend on who forms intent; it governs the transition from intention to authorized consequence."
  examples:
    - models
    - agents
    - humans
    - workflows
    - enterprise_software
    - robots
    - iot
    - payment_systems

commercial_thesis:
  rule: "Revenue should scale with verified governed consequences rather than human seat count or internal governance-event volume."
  statement: "Open execution is free. Enterprise pays when a governed consequence is completed and verified."
  settlement_statement: "Meter by tick internally; price and settle by consequence."
