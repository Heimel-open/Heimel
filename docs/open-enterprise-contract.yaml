schema_version: 2
product: Heimel
status: canonical

principle:
  open: "Everything required to understand, build, integrate, test and locally operate governed execution is open."
  commercial: "Everything required to govern governed execution authoritatively across an organization is commercial infrastructure."

open_heimel:
  guarantees:
    - complete_local_execution
    - no_phone_home
    - no_license_server
    - no_required_cloud_account
    - no_artificial_feature_disablement
    - local_allow_deny_escalate
    - revocation_and_fresh_authority_checks
    - deterministic_replay
    - local_receipts_and_evidence
  includes:
    - kernel
    - reht
    - racs
    - gateway_reference_and_runtime_surface
    - veritas_reference_and_runtime_surface
    - vaig
    - mal
    - workflow_isa
    - function_fabric
    - standard_functions
    - domain_packs
    - schemas
    - authority_contracts
    - provenance_envelope
    - conformance_suite
    - demonstrators
    - sdks
    - adapters
    - documentation
  invariant: "A user must be able to execute and prove the governed consequence path locally without contacting Heimel or obtaining a commercial entitlement."
  public_end_to_end_proof: tools/verify_open_e2e.py

enterprise:
  purpose: "Provide authoritative organization-level governance of governed execution."
  architecture_contract: docs/enterprise-control-plane.yaml
  commercial_model: "Enterprise engagements combine organizational software, deployment, certified integrations, assurance and support. Verified-consequence settlement is priced separately based on usage and risk profile."
  capabilities:
    - identity_federation
    - sso
    - scim
    - iam_integration
    - authority_administration
    - separation_of_duties
    - approval_flows
    - policy_lifecycle
    - policy_versioning
    - candidate_policy_replay
    - shadow_evaluation
    - rollback
    - organization_boundaries
    - delegated_administration
    - multi_tenant_isolation
    - consequence_credential_placement
    - secrets_management
    - deployment_governance
    - high_availability
    - disaster_recovery
    - retention
    - immutable_evidence_operations
    - observability
    - enterprise_integrations
    - assurance_controls
    - enterprise_support
    - sla
  assurance:
    includes:
      - authority_change_control
      - policy_change_control
      - revocation_provenance
      - audit_evidence_retention
      - upgrade_governance
      - failure_governance
      - dispute_evidence
      - responsibility_boundaries
  integrations:
    categories:
      - iam
      - siem
      - erp
      - workflow
      - agent_platforms
      - enterprise_software
  rule: "Enterprise must remain separable from the open governed-execution mechanism; it must not be a license lock around the same local capability."

partner_ecosystem:
  integrator_program:
    name: HEIMEL Integrator Program
    purpose: "Build and certify systems that can act with bounded authority."
    partner_access:
      - conformance_tooling
      - reference_integrations
      - sandbox_testing
      - certification_pathway
      - technical_enablement
      - joint_customer_delivery
      - verified_integrator_listing
  categories:
    - integrators
    - technology_and_platform_partners
    - assurance_and_certification_partners
  certification_rule: "Partner status and certification must bind to explicit tested profiles and versions; partnership alone does not imply conformance."

product_layers:
  heimel_open: "Defines and implements governed execution."
  heimel_enterprise: "Administers governed execution across an organization."
  heimel_gateway: "Enforces the exclusive consequence path."
  veritas: "Preserves attributable effect and outcome evidence."
  heimel_certified: "Provides official conformance and compatibility attestation."
  verified_consequence_settlement: "Settles contracted value only after the governed consequence satisfies its authorization, completion and evidence requirements."
  managed:
    - Heimel Cloud
    - Heimel Private Cloud
    - Heimel VPC
    - Heimel On-premises
    - Heimel Sovereign
    - Heimel Air-gapped

certification:
  conformance_suite: open
  official_attestation: commercial
  policy: docs/certification-policy.yaml
  program_elements:
    - versioned_standard
    - test_suite
    - control_points
    - certification_profile
    - recertification
    - verifiable_status
  attestation_must_bind:
    - implementation_identity
    - artifact_or_build_digest
    - conformance_suite_version
    - conformance_suite_digest
    - tested_profile
    - test_result
    - issuance_time
    - validity_or_expiry
  rule: "Passing the open suite does not imply an official Heimel certification unless an active attestation has been issued."

metering:
  primary_unit: governed_consequence_event
  schema: schemas/governed-consequence-event.schema.json
  local_projection: runtime/runtime-local/metering.py
  definition: "A consequence-path event with an exact effect identity, decision, permit/enforcement state and recorded outcome/evidence state."
  internal_unit: governed_tick
  billing_unit: verified_governed_consequence
  rule: "Governed ticks are internal observability and cost-accounting events. They are not the default customer billing unit."
  governed_tick_uses:
    - cost_accounting
    - observability
    - capacity_planning
    - audit
    - replay
  consequence_definition: "A contract-bound consequence whose governed effect completed and whose required evidence satisfies the consequence contract."
  required_dimensions:
    - tenant_or_organization
    - consequence_id
    - effect_type
    - decision
    - enforcement_result
    - outcome_state
    - evidence_reference
    - occurred_at
  identity_rule: "Replay of the same admitted consequence state must not create a new governed_consequence_event identity."
  commercial_pricing_rule: "Commercial pricing may use committed governed-consequence volume. A DENY is not treated as a successfully executed consequence unless a contract explicitly meters decision events separately."
  default_billable_outcome: "ALLOW + EXECUTED + SUCCESS + evidence_reference"
  no_charge_states:
    - DENY
    - ESCALATE
    - FAILED_EFFECT
    - UNVERIFIED_OUTCOME
    - DUPLICATE
  pricing_rule: "Enterprise pricing is consequence-based. Internal governance work may be metered by tick but customer settlement occurs only for a verified governed consequence."
  forbidden_default:
    - seat_based_primary_pricing
    - governed_tick_billing
    - charge_on_deny
    - charge_on_escalate
    - retrospective_invoice_required

settlement:
  model: prepaid_or_preauthorized_atomic_settlement
  principle: "Settlement follows verified consequence evidence and does not require retrospective invoicing."
  commercial_rule: "Verified-consequence settlement is a separate commercial layer priced by contracted usage and risk profile."
  sequence:
    - funding_or_allowance_bound
    - proposed_consequence
    - fresh_authority_check
    - permit_issue_and_binding
    - governed_effect
    - outcome_verification
    - consequence_receipt
    - atomic_settlement
  funding_modes:
    - prepaid_balance
    - escrow
    - bounded_payment_allowance
  invariants:
    - "No settlement before verified consequence evidence."
    - "DENY, ESCALATE, failed effects and unverified outcomes do not settle."
    - "A consequence_id may settle at most once."
    - "Settlement must bind to the exact consequence contract, price rule and evidence reference."
    - "Replay must reproduce settlement eligibility without causing a second charge."
    - "Open Heimel operation remains possible without any commercial settlement mechanism."
  price_contract:
    currency: USD
    reference_rates:
      micro: "0.001"
      standard_floor: "0.01"
      typical: "0.10"
    rule: "The operative rate is contract-bound before execution. Reference rates are defaults, not immutable protocol constants."
  smart_contract_semantics:
    required_fields:
      - settlement_contract_id
      - consequence_id
      - payer_account
      - currency
      - unit_price
      - funding_reference
      - price_rule_version
      - completion_criteria_hash
      - evidence_requirement_hash
      - idempotency_key
    terminal_states:
      - SETTLED
      - NOT_CHARGEABLE
      - INSUFFICIENT_FUNDS
      - SETTLEMENT_FAILED
  identity_rule: "Replay of the same admitted consequence state must not create a new governed_consequence_event identity."
  pricing_rule: "Commercial pricing may use committed governed-consequence volume. A DENY is not treated as a successfully executed consequence unless a contract explicitly meters decision events separately."
  default_billable_outcome: "ALLOW + EXECUTED + SUCCESS + evidence_reference"
  forbidden_default: seat_based_primary_pricing

licensing:
  repository_default: Apache-2.0
  map: docs/license-map.yaml
  standard_surfaces: permissive_open_source
  enterprise: separate_software_or_service
  rule: "Do not describe source-available or commercial-use-restricted code as open source."

deployment:
  forms:
    - cloud
    - private_cloud
    - vpc
    - on_premises
    - sovereign
    - isolated
    - air_gapped
  enterprise_controls:
    - region_and_data_residency
    - enterprise_key_management
    - customer_controlled_secrets
    - siem_integration
    - iam_integration
    - erp_integration
    - workflow_integration
  semantic_equivalence_rule: "Cloud, Private Cloud, VPC, On-premises, Sovereign, Isolated and Air-gapped are deployment forms of the same governance system, not divergent product semantics."

provider_independence:
  rule: "Heimel does not depend on who forms intent; it governs the transition from intention to authorized consequence."
  examples:
    - models
    - agents
    - humans
    - workflows
    - enterprise_software
    - robots
    - iot
    - payment_systems

commercial_thesis:
  rule: "Revenue should scale with verified governed consequences rather than human seat count or internal governance-event volume."
  statement: "Open execution is free. Enterprise engagements combine organizational software, deployment, certified integrations, assurance and support."
  settlement_statement: "Verified-consequence settlement is priced separately based on usage and risk profile."
