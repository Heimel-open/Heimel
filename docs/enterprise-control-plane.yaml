schema_version: 1
product: Heimel Enterprise
status: canonical
purpose: "Organization-level administration and operation around the open governed-consequence mechanism."

boundary:
  open_mechanism: "Heimel Open owns local governed execution and must remain independently operable."
  enterprise_control_plane: "Heimel Enterprise owns organization-scale administration, coordination and operations around that mechanism."
  invariant: "No Enterprise service may become an alternative consequence path or a commercial prerequisite for local governed execution."

control_plane_owners:
  identity_federation:
    owns:
      - enterprise identity-provider federation
      - SSO
      - SCIM synchronization
      - organization identity mapping
    does_not_own:
      - consequence-time authorization
      - direct effect execution

  authority_administration:
    owns:
      - authority grant administration
      - delegation administration
      - revocation administration
      - organization authority views
      - authority change provenance
    publishes_to: kernel_operative_state
    does_not_own:
      - REHT consequence-time authorization
      - Gateway enforcement

  policy_lifecycle:
    owns:
      - policy authoring workflow
      - versioning
      - approval
      - candidate-policy replay
      - shadow evaluation
      - activation
      - rollback
      - policy provenance
    publishes_to: kernel_operative_state
    rules:
      - "Candidate policies may be evaluated against historical execution frames before activation."
      - "Shadow evaluation must not create execution authority or real-world effect."
    does_not_own:
      - direct effect execution

  separation_of_duties:
    owns:
      - incompatible-role rules
      - approval separation rules
      - administration conflict controls
    enforcement_requirement: "Material SoD state must be available to the governed consequence-time decision."

  delegated_administration:
    owns:
      - bounded administrative scopes
      - delegation expiry
      - delegated-admin provenance
    rule: "Delegated administration cannot mint broader authority than the delegator is permitted to administer."

  tenancy:
    owns:
      - organization boundaries
      - tenant isolation
      - tenant-scoped configuration
      - tenant-scoped evidence operations
    rule: "Cross-tenant authority, secrets, policy and evidence access fail closed."

  deployment_governance:
    owns:
      - approved deployment profiles
      - environment promotion controls
      - configuration provenance
      - controlled rollout and rollback
      - region and data-residency controls
      - enterprise key-management integration
    rule: "Cloud, Private Cloud, VPC, On-premises, Sovereign, Isolated and Air-gapped preserve the same consequence semantics."

  consequence_credential_placement:
    owns:
      - consequence-bearing credential placement policy
      - executor credential isolation requirements
      - signing-capability isolation requirements
      - direct-effect-path validation
    invariant: "Credentials, signing capability, write access or equivalent effect-bearing capability must not give an upstream actor a direct path around Gateway."
    does_not_own:
      - consequence-time authorization
      - effect decision semantics

  enterprise_assurance:
    owns:
      - authority and policy change-control evidence
      - revocation provenance
      - upgrade governance
      - failure-mode governance
      - dispute evidence procedures
      - customer_integrator_heimel responsibility boundaries
    rule: "Assurance describes and verifies control operation; it does not create execution authority."

  retention:
    owns:
      - retention policies
      - legal-hold administration
      - evidence lifecycle operations
    does_not_own:
      - retroactive authorization
      - mutation of integrity-protected historical receipts

  high_availability_disaster_recovery:
    owns:
      - service redundancy
      - recovery objectives
      - backup and restore governance
      - continuity tests
    invariant: "Recovery must not create a bypass, duplicate one-shot permits or weaken replay protection."

  secrets_management:
    owns:
      - enterprise secret references
      - rotation
      - access policy
      - deployment-time secret delivery
    rule: "Secrets do not confer consequence authority by themselves."

  enterprise_integrations:
    owns:
      - IAM integration
      - SIEM integration
      - ERP integration
      - workflow integration
      - agent-platform integration
    rule: "Integrated systems remain upstream or downstream according to their role; integration does not collapse identity, policy or execution into authority."

  observability:
    owns:
      - control-plane health
      - operational metrics
      - audit telemetry
      - alerting
      - SLO and SLA evidence
    rule: "Observability is evidence and operations data, not authorization."

runtime_property_owners:
  operative_state: Kernel
  fresh_authorization: REHT
  deterministic_binding: RACS
  exclusive_effect_enforcement: Gateway
  attributable_effect_and_outcome_evidence: Veritas

state_flow:
  rule: "Enterprise administration may propose or publish governed administrative state; only admitted operative state can affect consequence-time authorization."
  path:
    - enterprise_administration
    - governed_state_change
    - kernel_state_admission
    - reht_fresh_authorization
    - gateway_enforcement
    - veritas_evidence

forbidden_architectures:
  - enterprise_bypass_to_effect
  - enterprise_license_gate_on_local_execution
  - policy_console_as_direct_execution_authority
  - identity_provider_as_sufficient_effect_authority
  - observability_or_receipt_as_retroactive_authorization
  - upstream_consequence_credentials_bypassing_gateway
