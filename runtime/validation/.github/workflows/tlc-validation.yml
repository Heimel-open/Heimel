name: VALO TLC Validation Simple

on:
  push:
    branches: [main]

jobs:
  tlc-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '11'
      
      - name: Download TLA+ Tools
        run: wget -q https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
      
      - name: Run TLC Validation
        run: java -cp tla2tools.jar tlc2.TLC -config ValoStateMachine.cfg ValoStateMachine.tla 2>&1 | tee tlc-results.txt
      
      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tlc-results
          path: tlc-results.txt
