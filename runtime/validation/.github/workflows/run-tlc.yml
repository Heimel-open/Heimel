name: Run TLC Validation

on:
  push:
    branches: [main]

jobs:
  tlc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Java
        run: sudo apt-get update && sudo apt-get install -y openjdk-11-jdk
      
      - name: Download TLA+ Tools
        run: wget -q https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
      
      - name: Run TLC
        run: java -cp tla2tools.jar tlc2.TLC -config ValoStateMachine.cfg ValoStateMachine.tla 2>&1 | tee tlc-results.txt
      
      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tlc-results
          path: tlc-results.txt

