[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "valo-edge"
version = "0.3.0"
description = "Embeddable authorization and evidence layer for local and physical AI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Njål Gaute Solland", email = "nsolland@gmail.com" }
]
dependencies = [
  "pydantic>=2.0.0",
  "jsoncanon>=0.2.3",
]

[project.optional-dependencies]
camera = [
  "Pillow>=10.0.0",
  "PyYAML>=6.0.0",
]
needle = [
  "cactus-needle",
]
dev = [
  "pytest>=7.0.0",
  "Pillow>=10.0.0",
  "PyYAML>=6.0.0",
]

[project.scripts]
lastseen = "valo_edge.lastseen.cli:main"
lastseen-camera = "valo_edge.lastseen.camera_cli:main"
lastseen-api = "valo_edge.lastseen.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
valo_edge = ["lastseen/web/*.html"]
