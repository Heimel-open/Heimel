[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "valo-retail-pack"
version = "0.1.0"
requires-python = ">=3.11"

[project.scripts]
valo-pod-broker = "valo_retail_pack.pod_service:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
