[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "valo-workflow-isa"
version = "1.0.1"
description = "VALO Workflow ISA — typed, deterministic workflow instruction set with explicit control flow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6,<3"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "hypothesis>=6.100",
]

[tool.hatch.build.targets.wheel]
packages = ["src/valo_workflow_isa"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests", "examples"]
python_files = ["test_*.py", "*_test.py", "demonstrator_*.py"]
addopts = "-q"

[tool.ruff.lint]
ignore = ["BLE001"]  # kernel/runtime catch all exceptions to fail closed
