[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "heimel-kernel"
version = "0.2.2"
description = "VALO Kernel + Governed World Model — deterministic state owner for the VALO governed world"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42",
    "pydantic>=2.6,<3",
    "rfc8785>=0.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "hypothesis>=6.100",
]

[tool.hatch.build.targets.wheel]
packages = ["src/valo_kernel"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests", "examples"]
addopts = "-q"

[tool.ruff.lint]
ignore = ["BLE001"]
