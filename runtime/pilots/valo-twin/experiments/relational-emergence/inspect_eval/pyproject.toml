[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "tofoo-relational-eval"
version = "0.1.0"
description = "Inspect AI evaluation for governed relational rule recovery"
requires-python = ">=3.10"
dependencies = [
  "inspect-ai==0.3.251",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "ruff>=0.12,<1",
]

[project.entry-points.inspect_ai]
tofoo_relational_eval = "tofoo_relational_eval._registry"

[tool.hatch.build.targets.wheel]
packages = ["src/tofoo_relational_eval"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
