[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "valo-reht"
version = "1.1.1"
description = "Real REHT: the sole authorization boundary of VALO, as a separate v1.1 candidate component."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "cryptography>=41.0",
    "rfc8785>=0.1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
norecursedirs = ["deps", ".*", "build"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "SIM", "PERF", "C4", "UP", "B", "BLE001"]
ignore = ["BLE001"]

[tool.ruff.lint.per-file-ignores]
"benchmarks/paired_governance/run_end_to_end.py" = ["I001"]
