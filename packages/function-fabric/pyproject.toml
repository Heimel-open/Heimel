[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "valo-function-fabric"
version = "1.1.0"
description = "Provider-neutral, governed function composition for HEIMEL"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6,<3",
    "heimel-kernel>=0.1,<1",
    "valo-workflow-isa>=1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "hypothesis>=6.100",
]

[tool.hatch.build.targets.wheel]
packages = ["src/valo_function_fabric"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests", "examples"]
python_files = ["test_*.py", "*_test.py", "demonstrator_*.py"]
addopts = "-q"

[tool.ruff.lint]
ignore = ["BLE001"]

