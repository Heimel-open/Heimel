[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "heimel-kernel"
version = "0.1.0"
description = "Minimal deterministic admission and operative-state reference core for HEIMEL"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6,<3",
    "rfc8785>=0.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/valo_kernel"]

[tool.ruff.lint]
ignore = ["BLE001"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
