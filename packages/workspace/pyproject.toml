[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "valo-workspace"
version = "0.1.0"
description = "VALO governed workspace and state-admission reference contracts"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6,<3", "rfc8785>=0.1.4"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/valo_workspace"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
