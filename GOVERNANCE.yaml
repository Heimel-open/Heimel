schema_version: 2
product: HEIMEL
status: canonical-repository-governance
effective_date: 2026-09-19
canonical_repository: Heimel-open/Heimel

current_authority:
  editors: repository-maintainers
  release_authority: repository-maintainers
  rule: "Repository ownership is not permission to silently change normative execution semantics."

trusted_party_boundary:
  self_hosted_open_heimel_requires_vendor_trust: false
  statements:
    - "No customer, hosted Heimel service, model provider, adapter vendor, certification customer or Enterprise deployment becomes a trusted party merely by operating the software."
    - "A self-hosted Open Heimel installation does not require Heimel or VALO Research to authorize, execute, replay or verify local governed consequences."

normative_properties:
  - NO_DIRECT_EFFECT_PATH
  - NO_UNGROUNDED_CLAIM_PATH
  - NO_IMPLICIT_CAPABILITY_TRANSFER
  - NO_UNGOVERNED_CROSS_WORKSPACE_PATH
  - NO_UNGOVERNED_HARNESS_TRANSITION
  - NO_INFERRED_AUTHORITY
  - NO_INFLUENCE_DERIVED_AUTHORITY
  - FRESH_AUTHORITY_AT_CONSEQUENCE_TIME
  - EXACT_DECISION_EFFECT_BINDING
  - FAIL_CLOSED_ON_MISSING_STALE_OR_MISMATCHED_STATE
  - ONE_SHOT_ENFORCEMENT_WHERE_PERMITS_ARE_USED
  - ATTRIBUTABLE_CONSEQUENCE_EVIDENCE
  - EVIDENCE_BACKED_STATE_ADMISSION
  - NO_MANDATORY_PHONE_HOME

inferred_authority_boundary:
  property: NO_INFERRED_AUTHORITY
  rule: "No digital twin, digital avatar, behavioral model, inferred preference, predicted decision, simulated consent, cognitive representation, probabilistic user model or collective model may create, extend, transfer or substitute effect authority."
  permitted_uses:
    - simulation
    - recommendation
    - forecasting
    - counterfactual_analysis
    - decision_support
  prohibited_authority_sources:
    - predicted_consent
    - inferred_intent
    - simulated_preference
    - behavioral_similarity
    - model_confidence
    - cognitive_or_relational_representation
  consequence_rule: "Authority for a real effect must resolve from an explicit admissible authority source and be freshly validated at consequence time."
  cognitive_compromise_assumption: "Any model, agent, human, collective, memory, context, message, inference or upstream decision process may be cognitively compromised. Cognitive confidence MUST NOT confer effect authority."

influence_boundary:
  property: NO_INFLUENCE_DERIVED_AUTHORITY
  principle: "HEIMEL does not prohibit an agent from disagreeing with, challenging, persuading or changing the mind of a principal. Influence is part of legitimate human-agent and human-human relationships."
  permitted_agent_behavior:
    - disagreement
    - challenge
    - persuasion
    - recommendation
    - preference_change
    - decision_support
  prohibited_conflations:
    - influence_as_authority
    - recommendation_as_consent
    - persuasion_as_delegation
    - preference_change_as_capability_grant
    - model_objective_as_principal_objective
  objective_transparency_rule: "An agent MUST NOT conceal a materially conflicting optimization objective when that conflict is relevant to the principal's decision or a downstream consequential action."
  separation_rule: "The system MUST distinguish the principal's expressed intent before material agent influence, the agent's recommendation or argument, the principal's subsequent decision, and the authority actually granted for consequence."
  authority_rule: "A principal decision reached after influence may be valid, but influence, recommendation, persuasion or preference change MUST NOT by itself create, extend, transfer or substitute effect authority."
  consequence_rule: "When a consequential action follows agent influence, authority MUST still resolve from an explicit admissible authority source and be freshly validated at consequence time."
  independent_prohibitions:
    - "A materially conflicting objective relevant to a consequential decision MUST NOT be concealed."
    - "Influence or a resulting preference or decision MUST NOT be treated as effect authority without an explicit admissible authority source."

evidence_admissibility_boundary:
  property: NO_UNGROUNDED_CLAIM_PATH
  status: conditional-capability
  decisions:
    - ADMIT
    - REFUSE
    - INSUFFICIENT
  minimum_binding:
    - source_ref
    - content_hash
    - read_ref
    - derivation_hash
    - evaluator_id
    - evaluator_version
    - sufficiency
  rule: "When a governing contract requires evidential support, a claim or decision basis MUST NOT become consequence-authorizable unless the required evidence is mechanically admissible."
  separation_rule: "Evidence admissibility may refuse or mark a basis insufficient; it MUST NOT create, extend, transfer or substitute execution authority."
  fail_closed_rule: "Missing, malformed, unsupported or insufficient required evidence MUST block consequence authorization before any effect permit is issued."
  replay_rule: "An admitted evidential basis SHOULD carry a deterministic derivation receipt sufficient to bind the evaluated source material and derivation into replay."

clean_room_model:
  canonical_description: docs/architecture/clean-room-model.md
  rule: "Heimel governs admission, harness transition, internal capability/communication boundaries, and consequence-time check-out; it does not require governance of every internal reasoning step."
  boundaries:
    check_in:
      - identity
      - provenance
      - admissibility
      - authority_context
    harness_airlock:
      - incoming_harness_identity_version_and_provenance
      - external_harness_identity_version_and_config_digest
      - pre_induction_assessment
      - controlled_regrounding
      - residual_induction_measurement
      - bounded_equivalence_scope
      - evidence_reference
    bounded_workspace:
      - role
      - purpose
      - tools
      - capabilities
      - communication_paths
    internal_invariants:
      - NO_IMPLICIT_CAPABILITY_TRANSFER
      - NO_UNGOVERNED_CROSS_WORKSPACE_PATH
      - NO_UNGOVERNED_HARNESS_TRANSITION
      - NO_INFERRED_AUTHORITY
      - NO_INFLUENCE_DERIVED_AUTHORITY
    check_out:
      - exact_proposed_consequence
      - fresh_authority
      - current_constraints
      - exact_effect_binding
      - exclusive_gateway_enforcement
      - verifiable_outcome_evidence
  harness_rule: "An external harness MUST NOT be presumed to override, erase or dominate an incoming/internal harness. Unknown or unmeasured residual inducement remains UNKNOWN and cannot be promoted into consequence-bearing work."

change_control:
  normative_change_definition: "A change is normative if a conforming implementation could behave differently because of it."
  required_record_fields:
    - affected_property_or_contract
    - compatibility_class
    - affected_schemas_runtime_and_integrations
    - security_impact
    - conformance_impact
    - required_positive_cases
    - required_negative_cases
    - migration_impact
    - decision_provenance
    - target_version
  acceptance_gates:
    - affected_tests_pass_on_exact_reviewed_revision
    - affected_conformance_cases_pass_on_exact_reviewed_revision
    - compatibility_class_recorded
    - security_and_migration_impact_recorded
    - immutable_historical_release_tags

normative_change_records:
  - change_id: NO_INFLUENCE_DERIVED_AUTHORITY-2026-09-19
    affected_property_or_contract:
      - NO_INFLUENCE_DERIVED_AUTHORITY
      - NO_INFERRED_AUTHORITY
      - FRESH_AUTHORITY_AT_CONSEQUENCE_TIME
    compatibility_class: MAJOR
    affected_schemas_runtime_and_integrations:
      - canonical_governance_schema
      - authority_resolution
      - agent_and_principal_interfaces
      - runtime_conformance_suite
    security_impact: "Closes the path where agent influence, recommendation, persuasion or a resulting preference is silently promoted into effect authority, while separately requiring disclosure of materially conflicting objectives relevant to consequential decisions."
    conformance_impact: "Conforming implementations must preserve disagreement and persuasion as permitted behavior, keep influence separate from authority, expose relevant materially conflicting objectives at the agent/principal boundary, and continue to require explicit fresh authority for real effects."
    required_positive_cases:
      - disagreement_or_persuasion_remains_permitted
      - post_influence_decision_with_explicit_fresh_grant_can_authorize
    required_negative_cases:
      - persuasion_alone_does_not_confer_effect_authority
      - preference_change_alone_does_not_confer_effect_authority
      - agent_objective_does_not_substitute_principal_authority
      - concealed_materially_conflicting_objective_is_nonconforming
    migration_impact: "Breaking governance change: implementations claiming conformance must add the influence/authority separation and objective-transparency requirements. Implementations already using explicit fresh consequence-time authority retain their effect-authorization path but must update conformance surfaces and agent/principal interfaces where applicable."
    decision_provenance: "Heimel-open/Heimel PR #72, repository-maintainer decision following review of agent influence and echo-chamber risk."
    target_version: governance-v2.0.0

compatibility:
  MAJOR: "May break an existing conforming implementation."
  MINOR: "May add optional or bounded capability without changing existing required behavior."
  PATCH: "May clarify or correct implementation without changing the normative contract."
  claim_rule: "Compatibility claims must name the exact protocol/profile/version."

conformance:
  suite_is_open: true
  passing_means: "The tested implementation satisfied the named suite/profile/version under the recorded test conditions."
  passing_does_not_mean:
    - official_heimel_certification
    - universal_deployment_security
    - deployment_operated_or_approved_by_heimel
    - permission_to_use_certification_marks

certification:
  service: Heimel Certified
  canonical_policy: certification/CERTIFICATION.yaml
  attestation_schema: certification/attestation.schema.json
  program_version: 0.1
  separate_from_open_conformance: true
  partner_status_included: false
  attestation_must_bind:
    - attestation_id
    - implementation_identity
    - version_or_commit
    - profile
    - conformance_suite_version
    - required_negative_cases
    - test_result
    - evidence_hash
    - issuance_time
    - validity_or_expiry
    - issuer_identity
    - status
  rule: "The Heimel Certified mark may be used only for the exact scope covered by an ACTIVE official attestation."

evidence_policy:
  canonical_surface: EVIDENCE.yaml
  allowed_statuses:
    - measured
    - claimed
    - synthetic
    - unknown
  rule: "No score, test count or maturity statement may carry a stronger claim than its evidence supports."

governance_transfer:
  allowed: true
  requirements:
    - explicit_versioned_transfer_record
    - new_canonical_venue
    - effective_version_and_date
    - freeze_last_repository_owned_normative_release
    - no_simultaneous_competing_canonical_sources

security_changes:
  private_coordination_allowed_before_disclosure: true
  provenance_and_versioning_required_after_disclosure: true

enterprise_separation:
  enterprise_may_administer:
    - policies
    - identities
    - authority
    - tenancy
    - deployment
    - evidence_operations
  enterprise_may_redefine_open_execution_semantics: false
  rule: "Enterprise may operate Open HEIMEL at organizational scale; it does not become the source of truth for what the open mechanism means."
