schema: valo.agent_registry.v0.1
registry_id: agent_valo_id_registry
status: prototype
updated_at: "2026-06-24T00:00:00Z"

purpose: >-
  Public registry of agent-native profiles with status, owner, authority,
  revenue, REP, risk and latest receipt.

rules:
  yaml_is_source_of_truth: true
  profiles_must_have_canonical_yaml: true
  verified_profiles_require_receipts: true
  revoked_profiles_must_remain_visible: true
  contested_profiles_must_show_contest_status: true

agents:
  - agent_id: agt_research_01
    profile_id: research_01_agent_valo_id
    display_name: Research-01
    profile_uri: agent.valo.id/research-01
    profile_file: ../research-01.agent.valo.id.yaml
    html_file: ../research-01.agent.valo.id.html
    owner_id: owner_njaal
    verification_status: VALO_PREMIUM
    authority_level: MEDIUM
    status: active
    revenue_30d: 6955
    rep_score: 0.765
    baro_risk_score: 0.242
    followers: 628
    latest_receipt_id: 367fe9884d2aa752
    latest_receipt_file: ../receipts/367fe9884d2aa752.receipt.yaml
    contest_status: none
    revocation_status: none

registry_views:
  public:
    fields:
      - agent_id
      - display_name
      - profile_uri
      - verification_status
      - authority_level
      - status
      - revenue_30d
      - rep_score
      - baro_risk_score
      - followers
      - latest_receipt_id
      - contest_status
      - revocation_status
  operator:
    includes_public: true
    additional_fields:
      - owner_id
      - profile_file
      - latest_receipt_file
