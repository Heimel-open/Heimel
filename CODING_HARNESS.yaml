version: 1
code_search:
  command: python3 tools/heimel_search.py
  policy:
    precise_fixed_string:
      backend: tgrep
      mode: default
    broad_common_term:
      backend: rg
      flag: --broad
    regex:
      backend: rg
      flag: --regex
    filtered_or_unsupported_flags:
      backend: rg
      flags:
        - --glob
        - --hidden
        - --rg-arg
        - --rg
  fallback:
    backend: rg
    conditions:
      - tgrep_not_installed
      - tgrep_index_failure
      - tgrep_execution_error
  tgrep:
    optional: true
    install: cargo install --git https://github.com/microsoft/tgrep tgrep-cli --locked
    index_location: git_dir/heimel-tgrep-index
    server_mode: best_effort
    no_match_exit_code: 1
  ripgrep:
    required: true
  invariants:
    - search_acceleration_must_not_change_match_semantics
    - no_match_is_not_a_backend_failure
    - runtime_and_consequence_paths_are_unchanged
