services:
  coherence-evaluator:
    build:
      context: ../..
      dockerfile: deploy/coherence/Dockerfile.evaluator
    environment:
      VAIG_COHERENCE_TOKEN: ${VAIG_COHERENCE_TOKEN:?VAIG_COHERENCE_TOKEN is required}
    ports:
      - "8002:8002"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/healthz', timeout=2).read()"
      interval: 5s
      timeout: 3s
      retries: 10

  coherence-replay:
    build:
      context: ../..
      dockerfile: deploy/coherence/Dockerfile.replay
    environment:
      VAIG_COHERENCE_REPLAY_OPERATOR_REF: ${VAIG_COHERENCE_REPLAY_OPERATOR_REF:?VAIG_COHERENCE_REPLAY_OPERATOR_REF is required}
      VAIG_COHERENCE_REPLAY_TOKEN: ${VAIG_COHERENCE_REPLAY_TOKEN:?VAIG_COHERENCE_REPLAY_TOKEN is required}
    ports:
      - "8003:8003"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/healthz', timeout=2).read()"
      interval: 5s
      timeout: 3s
      retries: 10
