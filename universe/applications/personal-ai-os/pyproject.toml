[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "paios"
version = "0.1.0"
description = "Personal AI Operating System / Digital Worker foundation — Canonical Memory, Maturity gate, governed action proposal (no execution)."
authors = [{ name = "Njål Gaute Solland" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
relaion = "paios.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["paios*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
filterwarnings = ["error"]
