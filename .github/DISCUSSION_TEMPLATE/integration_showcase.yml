title: "[INTEGRATION] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Show how a real consequence-bearing system maps into Heimel. Keep this concrete: effect path, authority boundary, failure mode and evidence.
  - type: input
    id: system
    attributes:
      label: System or framework
      placeholder: MCP, LangGraph, browser agent, enterprise API, tool runtime...
    validations:
      required: true
  - type: textarea
    id: effect
    attributes:
      label: Real effect
      description: What can this system actually change, send, execute, publish, pay, delete, approve or deploy?
    validations:
      required: true
  - type: textarea
    id: before
    attributes:
      label: Existing consequence path
      description: Describe the current path from intent to effect and where authority is checked.
    validations:
      required: true
  - type: textarea
    id: mapping
    attributes:
      label: Heimel mapping
      description: Show adapter, fresh authority check, exact binding, governed effect path and evidence.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What happened
      description: ALLOW, DENY, ESCALATE, bypass found, replay blocked, stale authority denied, or other observed result.
    validations:
      required: true
  - type: input
    id: code
    attributes:
      label: Code or reproduction link
      placeholder: PR, branch, gist or external repository
