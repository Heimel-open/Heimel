name: temporary tgrep code search gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  code-search:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ripgrep
          python3 -m pip install pytest
      - name: Unit routing and fallback tests
        run: python3 -m pytest -q tools/tests/test_heimel_search.py
      - name: Install tgrep
        run: cargo install --git https://github.com/microsoft/tgrep tgrep-cli --locked
      - name: Real search parity and fallback smoke
        run: |
          python3 tools/heimel_search.py NO_DIRECT_EFFECT_PATH > /tmp/tgrep.out
          rg -F --no-heading --color never NO_DIRECT_EFFECT_PATH . > /tmp/rg.out
          test "$(wc -l < /tmp/tgrep.out)" = "$(wc -l < /tmp/rg.out)"
          python3 tools/heimel_search.py evidence --broad > /tmp/broad.out
          rg -F --no-heading --color never evidence . > /tmp/broad-rg.out
          test "$(wc -l < /tmp/broad.out)" = "$(wc -l < /tmp/broad-rg.out)"
