name: Public boundary

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  public-boundary:
    name: public-boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce fail-closed public boundary
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          python3 tools/public_boundary_check.py --base "$base" --head "${{ github.sha }}"
