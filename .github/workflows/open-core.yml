name: Open core

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  release-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify all public packages
        run: python tools/release_verify.py

  static-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analysis tooling and declared dependencies
        run: |
          python - <<'PY'
          import subprocess
          import sys
          import tomllib
          from pathlib import Path

          dependencies = {"ruff", "mypy", "bandit", "pip-audit"}
          for path in Path("packages").glob("*/pyproject.toml"):
              project = tomllib.loads(path.read_text())
              dependencies.update(project["project"].get("dependencies", []))
          subprocess.check_call([sys.executable, "-m", "pip", "install", *sorted(dependencies)])
          PY
      - name: Lint public source and tests
        run: ruff check tools packages/*/src packages/*/tests
      - name: Type-check public source
        run: >-
          mypy --ignore-missing-imports --follow-imports=skip
          packages/mal/src
          packages/c-mcp/src
          packages/vaig/src
          packages/conformance/src
          packages/workspace/src
          packages/public-procurement/src
          packages/sdk/src
      - name: Static security scan
        run: >-
          bandit -q -r
          packages/mal/src
          packages/c-mcp/src
          packages/vaig/src
          packages/conformance/src
          packages/workspace/src
          packages/public-procurement/src
          packages/sdk/src
      - name: Dependency security scan
        run: pip-audit --strict --progress-spinner off
