name: Open core

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e 'packages/kernel[dev]' -e 'packages/workflow-isa[dev]' -e 'packages/function-fabric[dev]'
      - name: Compile
        run: python -m compileall -q packages/kernel/src packages/kernel/tests packages/workflow-isa/src packages/workflow-isa/tests packages/workflow-isa/examples packages/function-fabric/src packages/function-fabric/tests packages/function-fabric/examples
      - name: Lint
        run: python -m ruff check packages/kernel/src packages/kernel/tests packages/workflow-isa/src packages/workflow-isa/tests packages/workflow-isa/examples packages/function-fabric/src packages/function-fabric/tests packages/function-fabric/examples
      - name: Kernel conformance
        run: python -m pytest -q packages/kernel/tests
      - name: Workflow ISA conformance
        run: python -m pytest -q packages/workflow-isa/tests packages/workflow-isa/examples
      - name: Function Fabric conformance
        working-directory: packages/function-fabric
        run: python -m pytest -q
