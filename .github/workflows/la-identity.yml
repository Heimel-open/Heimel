name: LA Identity Gate
on: [push, pull_request]
jobs:
  layer-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Enforce canonical LA identity
        run: python3 ci/check_layer_identity.py
