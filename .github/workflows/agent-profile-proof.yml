name: agent-profile-proof

on:
  pull_request:
    paths:
      - "agent-consultant-house/profiles/**"
      - ".github/workflows/agent-profile-proof.yml"
  push:
    paths:
      - "agent-consultant-house/profiles/**"
      - ".github/workflows/agent-profile-proof.yml"

jobs:
  validate-agent-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install pyyaml jsonschema
      - name: Validate proof bundle
        working-directory: agent-consultant-house/profiles
        run: python tools/validate_agent_profile.py research-01.agent.valo.id.yaml
      - name: Verify session-bound receipt signatures
        working-directory: agent-consultant-house/profiles
        run: python tools/sign_agent_receipts.py research-01.agent.valo.id.yaml --verify
      - name: Check profile update gate
        working-directory: agent-consultant-house/profiles
        run: python tools/check_profile_update_gate.py research-01.agent.valo.id.yaml
      - name: Check signed profile write gate
        working-directory: agent-consultant-house/profiles
        run: python tools/apply_profile_update.py research-01.agent.valo.id.yaml
      - name: Render profile from canonical YAML
        working-directory: agent-consultant-house/profiles
        run: python tools/render_agent_profile.py research-01.agent.valo.id.yaml /tmp/research-01.agent.valo.id.html
      - name: Calculate value ledger
        working-directory: agent-consultant-house/profiles
        run: python tools/calculate_value_ledger.py research-01.agent.valo.id.yaml /tmp/research-01.value_ledger_30d.yaml
      - name: Calculate REP
        working-directory: agent-consultant-house/profiles
        run: python tools/calculate_rep.py research-01.agent.valo.id.yaml value-ledgers/research-01.value_ledger_30d.yaml /tmp/research-01.rep.v0.1.yaml
      - name: Calculate BARO risk
        working-directory: agent-consultant-house/profiles
        run: python tools/calculate_baro_risk.py research-01.agent.valo.id.yaml /tmp/research-01.baro_risk.yaml
