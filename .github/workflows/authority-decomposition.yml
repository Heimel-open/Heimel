name: Authority decomposition

on:
  pull_request:
    paths:
      - "tools/authority_decomposition.py"
      - "tests/test_authority_decomposition.py"
      - ".github/workflows/authority-decomposition.yml"

permissions:
  contents: read

jobs:
  authority-decomposition:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run executable authority-decomposition tests
        run: python -m unittest discover -s tests -p 'test_authority_decomposition.py' -v
