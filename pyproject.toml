[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "valo-insurance-pack"
version = "0.1.0"
description = "VALO Insurance Pack — machine-underwritable assurance and claims evidence layer over REHT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6,<3",
    "cryptography>=42.0",
    "rfc8785>=0.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/valo_insurance_pack"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests", "examples"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-q"

[tool.ruff.lint]
ignore = ["BLE001", "C408"]
